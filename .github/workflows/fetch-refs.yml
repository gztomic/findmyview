name: Fetch reference photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["refs/**/sources.json", "tools/fetch_refs.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python3 tools/fetch_refs.py beach
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add refs
          git diff --cached --quiet || (git commit -m "Fetch reference photos" && git push)
