name: Build models
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/models/**", "js/**", "index.html", "tools/ci/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Scene embeddings (CLIP text encoder)
        working-directory: tools/models
        run: npm ci && node build_scenes.mjs
      - name: Commit models/scenes.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add models/scenes.json
          git diff --cached --quiet || (git commit -m "Build scene embeddings" && git pull --rebase && git push)
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Browser smoke test
        run: |
          pip install playwright && python -m playwright install --with-deps chromium
          python tools/ci/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-screenshot, path: smoke.png, if-no-files-found: ignore }
